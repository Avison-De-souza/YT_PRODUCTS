<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Hydration - YouTuber Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylehome.css" />
</head>
<body>

  <!-- Header Section -->
  <header class="navbar">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo">
      <h2>YouTuber Products</h2>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="home.html">Home</a>
      <a href="about.html">About</a>
      <a href="home.html#shop" class="shop-nav-btn">Shop All</a>
    </nav>
  </header>

  <!-- Animated Moving Prime Logo Banner -->
  <div class="prime-banner">
    <div class="prime-track">
      <span>PRIME HYDRATION</span>
      <span>•</span>
      <span>PRIME ENERGY</span>
      <span>•</span>
      <span>PRIME STICKS</span>
      <span>•</span>
      <span>PRIME HYDRATION</span>
      <span>•</span>
      <span>PRIME ENERGY</span>
      <span>•</span>
      <span>PRIME STICKS</span>
      <span>•</span>
    </div>
  </div>

  <!-- Page Title -->
  <section class="category-section">
    <div class="section-title">
      <h2>Prime Product Collection</h2>
      <p>Explore official Prime Hydration, Energy drinks, and Sticks created by Logan Paul & KSI.</p>
    </div>

    <!-- Product Container (Loaded Dynamically from MongoDB) -->
    <div class="category-grid" id="primeProductGrid"></div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2025 YouTube Products | Created by <strong>Avison</strong></p>
    </div>
  </footer>

  <!-- MongoDB Fetching Script -->
  <script src="product.js"></script>
</body>
</html>
